# QuickFIX C++ Session Configuration
# Used by the matching engine daemon when running with QuickFIX session layer.
#
# This replaces the custom FixTcpAcceptor for FIX session management.
# The RealFixAdapter still handles FIX tag -> internal command translation.

[DEFAULT]
ConnectionType=acceptor
ReconnectInterval=60
SenderCompID=EXCHANGE
FileStorePath=./data/quickfix/store
FileLogPath=./data/quickfix/log
StartTime=00:00:00
EndTime=23:59:59
HeartBtInt=30
UseDataDictionary=Y
DataDictionary=FIX44.xml
ValidateFieldsOutOfOrder=N
ValidateUserDefinedFields=N
ResetOnLogon=Y
ResetOnLogout=Y
ResetOnDisconnect=Y

[SESSION]
BeginString=FIX.4.4
TargetCompID=*
SocketAcceptPort=19876
