# QuickFIX Acceptor Configuration — Multi-Version FIX Support
#
# Supports: FIX 4.0, 4.1, 4.2, 4.3, 4.4, 5.0 SP2
# Each version has its own [SESSION] block with the appropriate BeginString.
# Clients connect to the same port — QuickFIX routes by BeginString + TargetCompID.

[DEFAULT]
ConnectionType=acceptor
ReconnectInterval=60
SenderCompID=EXCHANGE
FileStorePath=./data/quickfix/store
FileLogPath=./data/quickfix/log
StartTime=00:00:00
EndTime=23:59:59
HeartBtInt=30
UseDataDictionary=Y
ValidateFieldsOutOfOrder=N
ValidateUserDefinedFields=N
SocketAcceptPort=19876

# FIX 4.0 sessions
[SESSION]
BeginString=FIX.4.0
TargetCompID=*
DataDictionary=./spec/FIX40.xml

# FIX 4.1 sessions
[SESSION]
BeginString=FIX.4.1
TargetCompID=*
DataDictionary=./spec/FIX41.xml

# FIX 4.2 sessions
[SESSION]
BeginString=FIX.4.2
TargetCompID=*
DataDictionary=./spec/FIX42.xml

# FIX 4.3 sessions
[SESSION]
BeginString=FIX.4.3
TargetCompID=*
DataDictionary=./spec/FIX43.xml

# FIX 4.4 sessions (primary)
[SESSION]
BeginString=FIX.4.4
TargetCompID=*
DataDictionary=./spec/FIX44.xml

# FIX 5.0 SP2 sessions (FIXT transport + FIX 5.0 application)
[SESSION]
BeginString=FIXT.1.1
TargetCompID=*
DefaultApplVerID=FIX.5.0SP2
TransportDataDictionary=./spec/FIXT11.xml
AppDataDictionary=./spec/FIX50SP2.xml
