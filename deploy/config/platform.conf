# ============================================================
# Matching Engine Platform — Pilot Configuration
# ============================================================
# This is a PROTOTYPE pilot configuration.
# Production deployment requires additional hardening.
# ============================================================

# ─── Partition Settings ────────────────────────────────────
partition.id=1
partition.pool_capacity=100000

# ─── Journal ───────────────────────────────────────────────
journal.type=segmented
journal.base_path=./data/journal
journal.max_segment_bytes=67108864
journal.flush_mode=sync

# ─── Snapshot ──────────────────────────────────────────────
snapshot.dir=./data/snapshots
snapshot.interval_sec=60

# ─── FIX Gateway ───────────────────────────────────────────
fix.listen_port=9876
fix.heartbeat_interval_sec=30
fix.session_store_path=./data/fix-sessions/sessions.dat

# ─── Market Data ───────────────────────────────────────────
marketdata.listen_port=9877
marketdata.format=json

# ─── Operations / HTTP ─────────────────────────────────────
ops.listen_port=8080

# ─── Risk ──────────────────────────────────────────────────
risk.enabled=true

# ─── EOD ───────────────────────────────────────────────────
eod.output_dir=./data/eod
eod.auto_trigger=true

# ─── Logging ───────────────────────────────────────────────
log.dir=./logs
log.level=info

# ─── TLS (when enabled) ────────────────────────────────────
# tls.enabled=false
# tls.cert_file=./config/tls/server.crt
# tls.key_file=./config/tls/server.key
# tls.ca_file=./config/tls/ca.crt
# tls.require_client_cert=false

# ─── Reference Data ───────────────────────────────────────
refdata.instruments_file=./config/instruments.json
refdata.sessions_file=./config/sessions.json
