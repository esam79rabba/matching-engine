# ============================================================
# Matching Engine — Pilot Environment Configuration
# ============================================================
# Copy this file to your install location and edit paths/ports.
# Lines starting with # are comments.
# ============================================================

# ─── Partition Settings ────────────────────────────────────
# Single partition for pilot. Increase pool_capacity if needed.
partition.id=1
partition.pool_capacity=100000

# ─── Journal ───────────────────────────────────────────────
# sync = Regulatory-Grade (fsync every write, zero data loss)
# batch = Reduced-Latency (periodic fsync, small data-loss window)
journal.type=segmented
journal.base_path=/opt/matching-engine/data/journal
journal.max_segment_bytes=67108864
journal.flush_mode=sync

# ─── Snapshot ──────────────────────────────────────────────
snapshot.dir=/opt/matching-engine/data/snapshots
snapshot.interval_sec=60

# ─── FIX Gateway ───────────────────────────────────────────
# Port for participant FIX connections.
fix.listen_port=9876
fix.heartbeat_interval_sec=30
fix.session_store_path=/opt/matching-engine/data/fix-sessions/sessions.dat

# ─── Market Data ───────────────────────────────────────────
# JSON-over-TCP market data feed.
marketdata.listen_port=9877
marketdata.format=json

# ─── Operations / HTTP ─────────────────────────────────────
# Health, instrument status, metrics, halt/resume, kill switch.
ops.listen_port=8080

# ─── Risk ──────────────────────────────────────────────────
risk.enabled=true

# ─── EOD ───────────────────────────────────────────────────
eod.output_dir=/opt/matching-engine/data/eod
eod.auto_trigger=true

# ─── Logging ───────────────────────────────────────────────
log.dir=/opt/matching-engine/logs
log.level=info

# ─── TLS ───────────────────────────────────────────────────
# Uncomment to enable TLS on the FIX port.
# Generate certs using docs/pilot/CERTIFICATE-AND-CREDENTIAL-PROVISIONING.md
# tls.enabled=true
# tls.cert_file=/opt/matching-engine/config/tls/server.crt
# tls.key_file=/opt/matching-engine/config/tls/server.key
# tls.ca_file=/opt/matching-engine/config/tls/ca.crt
# tls.require_client_cert=false

# ─── Reference Data ───────────────────────────────────────
refdata.instruments_file=/opt/matching-engine/config/instruments.json
refdata.sessions_file=/opt/matching-engine/config/sessions.json
