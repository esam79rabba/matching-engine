# ============================================================
# Matching Engine — Localhost Self-Pilot Configuration
# ============================================================
# For local self-pilot. Paths relative to working directory.
# ============================================================

partition.id=1
partition.pool_capacity=100000

journal.type=segmented
journal.base_path=./pilot-data/journal
journal.max_segment_bytes=67108864
journal.flush_mode=sync

snapshot.dir=./pilot-data/snapshots
snapshot.interval_sec=60

fix.listen_port=9876
fix.heartbeat_interval_sec=30
fix.session_store_path=./pilot-data/fix-sessions/sessions.dat

marketdata.listen_port=9877
marketdata.format=json

ops.listen_port=8180
ops.api_key=pilot-test-key-2026

risk.enabled=true

eod.output_dir=./pilot-data/eod
eod.auto_trigger=true

log.dir=./pilot-data/logs
log.level=info

tls.enabled=true
tls.cert_file=../deploy/pilot-env/tls/server.crt
tls.key_file=../deploy/pilot-env/tls/server.key

refdata.instruments_file=../deploy/pilot-env/instruments.json
refdata.sessions_file=../deploy/pilot-env/sessions.json
